name: Notify Search Engines

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'blog/**'
      - 'index.html'
      - 'duty/**'
      - 'shipping/**'

permissions:
  contents: read

jobs:
  ping-search-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages-production
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Wait for the exact production deployment
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AttahirLabs/attahirlabs.com"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -n "${CLOUDFLARE_PAGES_API_TOKEN:-}"
          test "$CLOUDFLARE_ACCOUNT_ID" = "6f945ca08a01d636e0b02f37e859d4d5"

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/attahirlabs/deployments?env=production"
          verified=false
          for attempt in $(seq 1 24); do
            response="$RUNNER_TEMP/cloudflare-pages-search-$attempt.json"
            if curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_PAGES_API_TOKEN" \
              --header "Content-Type: application/json" \
              "$endpoint" > "$response" \
              && node .github/scripts/verify-cloudflare-pages-deployment.mjs \
                --latest "$response" \
                --commit-sha "$GITHUB_SHA"; then
              verified=true
              break
            fi
            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done
          test "$verified" = true

      - name: Verify public sitemap
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            --output /tmp/attahirlabs-sitemap.xml \
            "https://attahirlabs.com/sitemap.xml"
          test -s /tmp/attahirlabs-sitemap.xml

      - name: IndexNow - Notify Bing of changed URLs
        run: |
          # Find every file changed across the full push range. A branch-creation
          # push has an all-zero before SHA and is treated as a full-tree change.
          if ! CHANGED=$(bash tools/search-changed-files.sh \
            "${{ github.event.before }}" \
            "${{ github.sha }}"); then
            echo "::error::Unable to determine changed files for this push"
            exit 1
          fi
          
          # Build list of URLs from changed blog posts and pages
          URLS=""
          while IFS= read -r file; do
            case "$file" in
              blog/*/index.html)
                # Extract blog slug: blog/my-post/index.html -> /blog/my-post/
                slug=$(echo "$file" | sed 's|/index.html||')
                URLS="$URLS\"https://attahirlabs.com/$slug/\","
                ;;
              index.html)
                URLS="$URLS\"https://attahirlabs.com/\","
                ;;
              duty/index.html)
                URLS="$URLS\"https://attahirlabs.com/duty/\","
                ;;
              shipping/index.html)
                URLS="$URLS\"https://attahirlabs.com/shipping/\","
                ;;
              sitemap.xml)
                # Sitemap changed, notify about the sitemap itself
                ;;
            esac
          done <<< "$CHANGED"
          
          # Remove trailing comma
          URLS="${URLS%,}"
          
          if [ -z "$URLS" ]; then
            echo "No indexable URLs changed, skipping IndexNow"
            exit 0
          fi
          
          echo "Submitting to IndexNow: $URLS"
          
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"attahirlabs.com\",
              \"key\": \"${{ secrets.INDEXNOW_KEY }}\",
              \"urlList\": [$URLS]
            }"
          echo ""
          echo "IndexNow accepted the submission"
